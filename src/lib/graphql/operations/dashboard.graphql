query Dashboard {
  subject(kind: "task") {
    id
    status
    priority
  }
  daemon {
    running
    version
    projectRoot
  }
  daemonHealth {
    healthy
    status
    plugins {
      name
      kind
      status
    }
  }
  daemonAgents {
    sessionId
    provider
    model
    workflowId
    phaseId
  }
  queueStats {
    total
    ready
    held
    inFlight
  }
}
