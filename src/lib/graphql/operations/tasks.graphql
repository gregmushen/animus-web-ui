query Subjects($kind: String, $status: SubjectStatus) {
  subject(kind: $kind, status: $status) {
    id
    kind
    title
    description
    status
    nativeStatus
    priority
    assignee
    labels
    parent
    children
    url
    createdAt
    updatedAt
  }
}

query SubjectDetail($id: ID!) {
  subjectById(id: $id) {
    id
    kind
    title
    description
    status
    nativeStatus
    statusMetadata
    priority
    assignee
    labels
    parent
    children
    url
    createdAt
    updatedAt
    custom
    attachments {
      id
      kind
      uri
      title
      mimeType
      metadata
    }
  }
}

query SubjectNext($kind: String) {
  subjectNext(kind: $kind) {
    id
    kind
    title
    status
    priority
  }
}

mutation CreateSubject($input: CreateSubjectInput!) {
  createSubject(input: $input) {
    id
    kind
    title
    status
  }
}

mutation UpdateSubject($input: UpdateSubjectInput!) {
  updateSubject(input: $input) {
    id
    status
    assignee
    labels
  }
}

mutation SetSubjectStatus($id: ID!, $status: SubjectStatus!) {
  setSubjectStatus(id: $id, status: $status) {
    id
    status
    nativeStatus
  }
}
