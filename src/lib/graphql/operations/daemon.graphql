query Daemon {
  daemon {
    running
    pid
    uptimeSeconds
    version
    projectRoot
    logPath
  }
  daemonHealth {
    healthy
    status
    lastError
    plugins {
      name
      kind
      status
      uptimeMs
      lastError
    }
  }
  daemonAgents {
    sessionId
    provider
    model
    workflowId
    phaseId
    startedAt
  }
}

mutation StartDaemon {
  startDaemon
}
